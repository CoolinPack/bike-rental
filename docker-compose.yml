services:
  postgres:
    image: postgres:16-alpine
    container_name: bike_rental_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bikeuser
      POSTGRES_PASSWORD: bikepass
      POSTGRES_DB: bike_rental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikeuser -d bike_rental"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: